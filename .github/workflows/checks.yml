name: Checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python checks · ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The helpers run on whatever interpreter the distribution ships, so
        # the range that matters is Debian 12's 3.11 up to a current Fedora.
        # None of the checks need anything beyond the standard library.
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Translation catalogs match the QML
        run: python3 scripts/check_translations.py

      - name: DEP-11 and apt/pacman changelog paths
        run: python3 scripts/test_dep11.py

      - name: Upstream notes for packages built from git
        run: python3 scripts/test_gitnotes.py

      - name: What a DMS plugin update changes
        run: python3 scripts/test_plugin_notes.py

      - name: Reconciling the action log against install times
        run: python3 scripts/test_reconcile.py

      - name: The rpm-ostree backend
        run: python3 scripts/test_ostree_helper.py

      - name: The Arch news feed
        run: python3 scripts/test_arch_news.py

      - name: The Homebrew path
        run: python3 scripts/test_brew_helper.py

      - name: The pacman path
        run: python3 scripts/test_pacman_helper.py

      - name: The Flatpak path
        run: python3 scripts/test_flatpak_helper.py

      - name: Recording a run and playing it back
        run: python3 scripts/test_simulate.py

      - name: AppImages are read, never run
        run: python3 scripts/test_appimage_squashfs.py

      - name: AppImage replaced outside the depot
        run: python3 scripts/test_appimage_updates.py

      - name: The .appimage association survives the rename
        run: python3 scripts/test_handler_migrate.py

      - name: The shell snippets run under dash, not just bash
        run: python3 scripts/test_shell_portability.py

      - name: Everything else at least parses
        run: python3 -m compileall -q scripts

  apt:
    name: What apt-get upgrade keeps back · ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Debian's oldest apt we support, its current one, and Ubuntu, where
        # phased updates are the norm
        image: ['debian:12', 'debian:13', 'ubuntu:24.04']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: python-apt and apt-ftparchive
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-apt apt-utils

      - name: Kept-back updates are held, with the reason
        env:
          DSD_APT_SANDBOX: '1'
        run: python3 scripts/test_apt_kept_back.py

  flatpak-files:
    name: A .flatpak or .flatpakref installs through libflatpak
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      # The real libflatpak, in throwaway installations: the system Python,
      # since that is the one the typelib is installed for
      - name: flatpak and its typelib
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq flatpak gir1.2-flatpak-1.0 python3-gi

      - name: Bundles, references, and files that are neither
        run: python3 scripts/test_flatpak_files.py

  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: plugin.json is valid and its version has a changelog
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          plugin = json.loads(pathlib.Path("plugin.json").read_text())
          version = plugin["version"]

          # The in-app update offer shows the section for the version it is
          # about to install, so a release without one ships a blank notice.
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if not re.search(rf"^## {re.escape(version)} — ", changelog, re.M):
              sys.exit(f"plugin.json says {version}, CHANGELOG.md has no '## {version} — …' section")

          print(f"plugin.json {version}: valid JSON, changelog section present")
          PY
